services:
  postgres:
    image: postgres:16.6-alpine3.20
    container_name: familyquest-postgres
    environment:
      POSTGRES_DB: familyquest
      POSTGRES_USER: familyquest
      POSTGRES_PASSWORD: familyquest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - familyquest-postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

  swagger-ui:
    image: docker.swagger.io/swaggerapi/swagger-ui:v5.17.14
    container_name: familyquest-swagger-ui
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    ports:
      - "8081:8080"
    volumes:
      - ./api/openapi.yaml:/openapi/openapi.yaml:ro

volumes:
  familyquest-postgres-data:
